<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragmentos/base :: cabeza('Iniciar sesión')}"></head>
<body>
<div class="login-fondo">
    <div class="login-caja">
        <div class="marca" style="color:#12284A">UTA <span style="color:#2E6AB0">Matrícula</span></div>
        <h1 style="margin-top:18px">Iniciar sesión</h1>
        <p class="subtitulo">Universidad Tecnológica de los Andes · Periodo 2027-1</p>

        <div class="alerta error" th:if="${param.error}">Usuario o contraseña incorrectos.</div>
        <div class="alerta ok" th:if="${param.salida}">Cerraste sesión correctamente.</div>

        <form th:action="@{/login}" method="post">
            <div class="campo">
                <label for="username">Usuario</label>
                <input id="username" name="username" autocomplete="username" required autofocus>
            </div>
            <div class="campo">
                <label for="password">Contraseña</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required>
            </div>
            <button class="boton" type="submit" style="width:100%">Entrar</button>
        </form>

        <div class="ayuda">
            <b>Usuarios de prueba (datos ficticios)</b><br>
            Estudiante: <code>laura.gomez</code> · <code>andres.rojas</code> — clave <code>Uta2027*</code><br>
            Administrador: <code>admin.registro</code> — clave <code>Admin2027*</code>
        </div>
    </div>
</div>
</body>
</html>
