# ---------------------------------------------------------------
# Sistema de Matrícula UTA — configuración del prototipo
# ---------------------------------------------------------------
spring.application.name=matricula-uta
server.port=8080

# Base de datos embebida H2 (en memoria) para que la demo corra en cualquier computador.
# Para usar PostgreSQL, ejecutar con el perfil "postgres" (ver application-postgres.properties).
spring.datasource.url=jdbc:h2:mem:matricula;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;LOCK_TIMEOUT=10000
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=true
spring.h2.console.enabled=false

# Pool de conexiones (Hikari)
spring.datasource.hikari.maximum-pool-size=20

# Reglas del negocio
matricula.valor-credito=350000
matricula.minutos-espera-pago=15
matricula.revision-vencidas-ms=60000
matricula.datos-demo=true

# Pasarela simulada: false = el usuario decide en pantalla si aprueba o rechaza
pasarela.simulada.aprobacion-automatica=false

# Rendimiento (ajustes hechos tras la primera prueba de carga, ver CP-07)
spring.thymeleaf.cache=true
spring.jpa.properties.hibernate.default_batch_fetch_size=50
logging.level.org.hibernate.SQL=off
